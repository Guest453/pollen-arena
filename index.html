<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pollen Arena — community vs official</title>
        <meta
            name="description"
            content="Blind side-by-side battles between official Pollinations models and the community models claiming the same name."
        />
        <link rel="preconnect" href="https://enter.pollinations.ai" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header class="bar">
            <div class="brand">
                <span class="dot"></span>
                <span>Pollen <b>Arena</b></span>
            </div>
            <div class="bar-actions">
                <select id="matchup" class="matchup-select" hidden></select>
                <span id="account" class="account"></span>
                <button id="connect" class="ghost-btn">Connect</button>
            </div>
        </header>

        <!-- Landing: one quiet prompt box -->
        <section id="landing" class="landing">
            <h1 class="landing-title">Which one is real?</h1>
            <p class="landing-sub">
                Send one prompt to an official model and a community model
                claiming its name. Blind. Vote, then see the truth.
            </p>

            <form id="composer" class="composer">
                <textarea
                    id="prompt"
                    class="composer-input"
                    rows="1"
                    placeholder="Ask them anything…"
                ></textarea>
                <button
                    type="submit"
                    id="send"
                    class="send-btn"
                    aria-label="Send"
                    disabled
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 19V5M12 5l-6 6M12 5l6 6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </form>

            <div id="suggestions" class="suggestions"></div>
            <p id="status" class="status"></p>
        </section>

        <!-- Arena: two live panels -->
        <section id="arena" class="arena" hidden>
            <article class="panel" data-side="a">
                <header class="panel-head">
                    <span class="badge">A</span>
                    <span class="panel-model" id="model-a">Model A</span>
                    <button class="think-toggle" id="think-a" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.6v.6h5.6v-.6c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <span>Thinking</span>
                    </button>
                </header>
                <div class="thinking" id="thinking-a" hidden>
                    <div class="thinking-inner" id="thinking-text-a"></div>
                </div>
                <div class="answer" id="answer-a"></div>
                <footer class="panel-foot" id="foot-a"></footer>
            </article>

            <article class="panel" data-side="b">
                <header class="panel-head">
                    <span class="badge">B</span>
                    <span class="panel-model" id="model-b">Model B</span>
                    <button class="think-toggle" id="think-b" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.6v.6h5.6v-.6c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <span>Thinking</span>
                    </button>
                </header>
                <div class="thinking" id="thinking-b" hidden>
                    <div class="thinking-inner" id="thinking-text-b"></div>
                </div>
                <div class="answer" id="answer-b"></div>
                <footer class="panel-foot" id="foot-b"></footer>
            </article>
        </section>

        <!-- Vote + verdict -->
        <section id="verdict" class="verdict" hidden>
            <div class="vote-row">
                <button class="vote-btn" id="vote-a" disabled>A is better</button>
                <button class="vote-btn" id="vote-tie" disabled>Tie</button>
                <button class="vote-btn" id="vote-b" disabled>B is better</button>
            </div>
            <div class="verdict-body" id="verdict-body" hidden>
                <h2 id="verdict-title">Verdict</h2>
                <dl class="facts">
                    <div><dt>You picked</dt><dd id="fact-pick">—</dd></div>
                    <div><dt>Total cost</dt><dd id="fact-cost">—</dd></div>
                    <div><dt>Latency A / B</dt><dd id="fact-latency">—</dd></div>
                    <div><dt>Models</dt><dd id="fact-models">—</dd></div>
                </dl>
                <button class="ghost-btn" id="again">New battle</button>
            </div>
        </section>

        <script type="module" src="./app.js"></script>
    </body>
</html>
